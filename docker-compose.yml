services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_radar
      POSTGRES_USER: stock_radar
      POSTGRES_PASSWORD: stock_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file:
      - .env
    command: uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ./apps/dashboard
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  worker:
    build: .
    env_file:
      - .env
    command: celery -A workers.tasks:celery_app worker --loglevel=info
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    env_file:
      - .env
    command: celery -A workers.tasks:celery_app beat --loglevel=info
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
